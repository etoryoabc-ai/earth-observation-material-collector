name: Windows launcher verification
on:
  push:
    paths:
      - '*.bat'
      - 'launcher.py'
      - 'tests/test_launcher*.py'
      - '.github/workflows/windows-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All tests including actual cmd.exe and Japanese paths
        run: python -m unittest discover -s tests -v
